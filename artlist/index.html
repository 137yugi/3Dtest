<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artlist AI 公開証拠・被害申告支援ハブ</title>
<meta name="description" content="Artlist / Seedance 2.5 をめぐる公開証拠、Wayback調査結果、被害申告・証拠保全ツール。">
<style>
html,body{height:100%;margin:0;background:#08090b;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(720px,100%);border:1px solid #34373d;border-radius:20px;background:#111318;padding:28px;box-shadow:0 24px 80px #0008}
h1{font-size:clamp(24px,5vw,42px);margin:0 0 12px}p{line-height:1.7;color:#c7cbd1}progress{width:100%;height:12px}code{word-break:break-all;color:#f5ce75}.err{white-space:pre-wrap;color:#ffb4b4}
</style>
</head>
<body><main><section class="card"><h1>公開証拠ハブを読み込み中</h1><p id="status">検証済みの圧縮データを取得しています。個人情報はブラウザ外へ送信しません。</p><progress id="progress" max="23" value="0"></progress><p><small>Source SHA-256: <code>ed0e2069faa146ae826f7b695944ec7379befa56b8529eca3903be9b75f218a3</code></small></p><p id="error" class="err" hidden></p></section></main>
<script>
(async()=>{
  const files=["payload/00.txt", "payload/01.txt", "payload/02.txt", "payload/03.txt", "payload/04.txt", "payload/05.txt", "payload/06.txt", "payload/07.txt", "payload/08.txt", "payload/09.txt", "payload/10.txt", "payload/11.txt", "payload/12.txt", "payload/13.txt", "payload/14.txt", "payload/15.txt", "payload/16.txt", "payload/17.txt", "payload/18.txt", "payload/19.txt", "payload/20.txt", "payload/21.txt", "payload/22.txt"];
  const status=document.getElementById('status');
  const progress=document.getElementById('progress');
  const error=document.getElementById('error');
  try{
    if(!('DecompressionStream' in window)) throw new Error('このブラウザは DecompressionStream に対応していません。Chrome / Edge / Safari / Firefox の最新版で開いてください。');
    let b64='';
    for(let i=0;i<files.length;i++){
      status.textContent=`公開資料を取得中 ${i+1} / ${files.length}`;
      const r=await fetch(files[i],{cache:'no-store'});
      if(!r.ok) throw new Error(`${files[i]} の取得に失敗しました（HTTP ${r.status}）`);
      b64+=(await r.text()).trim();
      progress.value=i+1;
    }
    status.textContent='資料を展開しています…';
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    status.textContent='読み込みに失敗しました。';
    error.hidden=false;
    error.textContent=String(e && e.stack || e);
  }
})();
</script></body></html>
