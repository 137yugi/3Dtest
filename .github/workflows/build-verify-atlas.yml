name: Build, deploy, and verify Atlas live

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[atlas-verify]')) ||
      (github.event_name == 'pull_request_target' && startsWith(github.event.pull_request.title, '[atlas-verify]'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Reconstruct the production single-file Atlas
        shell: bash
        run: |
          set -euo pipefail
          cat atlas/parts/p*.txt > atlas/index.html
          test -s atlas/index.html
          test "$(wc -c < atlas/index.html)" -gt 300000
          grep -q 'AI × HUMAN INTERFACE ATLAS 300' atlas/index.html
          grep -q 'Miro' atlas/index.html
          grep -q 'tldraw' atlas/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the exact production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Open the public URL in Chrome and verify the rendered UI
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          PAGE_ROOT: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p atlas/verification
          base="${PAGE_ROOT%/}/atlas/"
          ok=0

          for attempt in $(seq 1 24); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            target="${base}?v=${nonce}"
            code=$(curl -L -sS --max-time 30 -o /tmp/atlas-entry.html -w '%{http_code}' "$target" || true)
            bytes=$(wc -c </tmp/atlas-entry.html 2>/dev/null || echo 0)
            echo "attempt=${attempt} code=${code} bytes=${bytes} target=${target}"
            if [ "$code" = '200' ] && grep -q 'AI × HUMAN INTERFACE ATLAS 300' /tmp/atlas-entry.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = '1'

          nonce="${GITHUB_RUN_ID}-chrome-$(date +%s)"
          target="${base}?v=${nonce}"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --virtual-time-budget=25000 \
            --dump-dom \
            "$target" > atlas/verification/live-dom.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --virtual-time-budget=25000 \
            --screenshot=atlas/verification/live.png \
            "$target"

          grep -q 'AI × HUMAN INTERFACE ATLAS 300' atlas/verification/live-dom.html
          grep -q 'Miro' atlas/verification/live-dom.html
          grep -q 'tldraw' atlas/verification/live-dom.html
          grep -q '全300件' atlas/verification/live-dom.html

          export VERIFIED_URL="$base"
          python - <<'PY'
          from pathlib import Path
          import datetime, json, os, re

          dom = Path('atlas/verification/live-dom.html').read_text(errors='replace')
          png = Path('atlas/verification/live.png')
          result = {
              'verified': True,
              'url': os.environ['VERIFIED_URL'],
              'verified_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_commit_sha': os.environ.get('GITHUB_SHA'),
              'title_present': 'AI × HUMAN INTERFACE ATLAS 300' in dom,
              'all_300_present': '全300件' in dom,
              'miro_present': 'Miro' in dom,
              'tldraw_present': 'tldraw' in dom,
              'search_ui_present': '検索' in dom,
              'tool_card_mentions': len(re.findall(r'tool-card', dom)),
              'dom_bytes': len(dom.encode()),
              'screenshot_bytes': png.stat().st_size,
          }
          Path('atlas/verification/live.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Persist the exact page and browser evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f atlas/verification/live-dom.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas/index.html atlas/verification/live.json atlas/verification/live.png
          if ! git diff --cached --quiet; then
            git commit -m 'Publish and browser-verify Atlas live'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
