<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI × HUMAN INTERFACE ATLAS 300</title><style>html,body{margin:0;background:#080b12;color:#f4f7fb;font-family:system-ui,sans-serif}#status{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.dot{display:inline-block;animation:b 1s infinite alternate}@keyframes b{to{opacity:.25}}</style></head><body><div id="status"><div>AI × HUMAN INTERFACE ATLAS 300<br><span class="dot">読み込み中…</span></div></div><script>(async()=>{try{const parts=[];for(let i=0;i<14;i++){const n=String(i).padStart(2,"0");const r=await fetch(`./parts/p${n}.txt`);if(!r.ok)throw new Error(`part ${n}: ${r.status}`);parts.push(await r.text())}const html=parts.join("");document.open();document.write(html);document.close()}catch(e){document.getElementById("status").innerHTML=`<pre style="white-space:pre-wrap">読み込みに失敗しました\n${String(e)}</pre>`}})();</script></body></html>
